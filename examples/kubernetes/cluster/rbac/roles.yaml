apiVersion: v1
kind: Namespace
metadata:
  name: chaos-agents
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: injector, namespace: chaos-agents}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: observer, namespace: chaos-agents}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: triager, namespace: chaos-agents}
---
# Injector: create/delete a small set of chaos CRs in the target namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: injector, namespace: boutique}
rules:
  - apiGroups: [chaos-mesh.org]
    resources: [podchaos, networkchaos, stresschaos]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: injector, namespace: boutique}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: injector}
subjects: [{kind: ServiceAccount, name: injector, namespace: chaos-agents}]
---
# Observer and Triager: strictly read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: reader, namespace: boutique}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [chaos-mesh.org]
    resources: ["*"]
    verbs: [get, list, watch]
  # Steady-state checks hit the frontend through the API server proxy (GET only).
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["frontend:80"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: reader, namespace: boutique}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: reader}
subjects:
  - {kind: ServiceAccount, name: observer, namespace: chaos-agents}
  - {kind: ServiceAccount, name: triager, namespace: chaos-agents}
---
# Metrics: query Prometheus through the API server proxy (GET only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus-query, namespace: monitoring}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["prometheus-server:80"]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus-query, namespace: monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-query}
subjects:
  - {kind: ServiceAccount, name: observer, namespace: chaos-agents}
  - {kind: ServiceAccount, name: triager, namespace: chaos-agents}
