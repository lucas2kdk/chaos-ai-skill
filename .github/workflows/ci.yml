name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats, jq and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats jq shellcheck
      - name: Every script is executable
        run: |
          missing=0
          while IFS= read -r f; do
            if [ "$(head -c 2 "$f")" = '#!' ] && [ ! -x "$f" ]; then
              echo "not executable: $f"; missing=1
            fi
          done < <(git ls-files)
          exit "$missing"
      - name: Tests
        run: bats tests/
      - name: Shellcheck
        run: |
          files=()
          while IFS= read -r f; do
            case "$f" in *.bats) continue ;; esac
            if head -n 1 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then files+=("$f"); fi
          done < <(git ls-files)
          shellcheck --severity=warning "${files[@]}"
